name: Restore HAREFF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git restore --source=470b8d880c7245eced778cdef49b7876f8cba733 -- index.html
          git config user.name "HAREFF Restore"
          git config user.email "restore@users.noreply.github.com"
          git add index.html
          git commit -m "Restore HAREFF editor"
          git push
