name: HV One Panel Order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/panel-order.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          a = '<aside class="side">'
          b = '<div class="group"><h2>01 / ПРОФИЛЬ ОБРАБОТКИ</h2>'
          c = '<div class="foot">'
          assert all(s.count(x)==1 for x in (a,b,c))
          i = s.index(a)+len(a)
          j = s.index(b,i)
          k = s.index(c,j)
          if j > i:
              s = s[:i]+s[j:k]+s[i:j]+s[k:]
          p.write_text(s,encoding='utf-8')
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          assert 'hv-one-1.2-pages' in s
          s = s.replace('hv-one-1.2-pages1','hv-one-1.2-pages2')
          p.write_text(s,encoding='utf-8')
          PY
          node --check sw.js
          git config user.name "HV One Update"
          git config user.email "update@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "Move auxiliary panels below editing tools"
          git push
