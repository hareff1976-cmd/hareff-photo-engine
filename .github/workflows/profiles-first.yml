name: HV One Profiles First
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profiles-first.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "b.onclick=()=>openExtra(e);nav.append(b)}"
          new = "b.onclick=()=>openExtra(e);if(e[0]==='profiles')nav.prepend(b);else nav.append(b)}"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          s = s.replace("['profiles','Профиль','Profile',", "['profiles','Профили','Profiles',", 1)
          p.write_text(s, encoding='utf-8')
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          assert s.count('hv-one-1.3.2-compact-pages1') == 1
          p.write_text(s.replace('hv-one-1.3.2-compact-pages1','hv-one-1.3.2-compact-pages2'), encoding='utf-8')
          PY
          node --check sw.js
          git config user.name "HV One Update"
          git config user.email "update@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Move Profiles to first tool"
          git push
