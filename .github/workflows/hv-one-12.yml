name: HV One 1.2 Branding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hv-one-12.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY_PATCH'
          from pathlib import Path
          import json, base64
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          assert all(k in s for k in ['hareff.signature01.token.v1','HAREFF-SIGNATURE-01','HAREFF_PHOTO_PRESET','HAREFF_Photo_Projects_v1','fidelityNeutral','presetImportSequence']), 'Wrong base version: expected 1.1.1'
          if 'HV One 1.2 branding' not in s:
              replacements=[('<div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#d2d6dc" d="M14 9h10v46H14zM40 9h10v46H40zM5 46L59 16 59 21 5 51z"/></svg><div><strong>HAREFF</strong><small>PHOTO ENGINE / 1.0 RC</small></div></div>', '<div class="brand"><svg viewBox="0 0 128 128" aria-hidden="true"><g fill="#D7DADF"><path d="M29 35H45L37 61H62L69 35H85L68 91H52L58 75H33L25 91H9Z"/><path d="M55 37L93 13 82 75 67 91 76 36Z"/><path d="M65 59L79 86 106 43H123L88 100H73L60 75Z"/></g></svg><div><strong>HV One</strong><small>PHOTO EDITOR / 1.2</small></div></div>'), ('HAREFF Photo Engine 1.1.1 — Original Fidelity', 'HV One 1.2 — Original Fidelity'), ('HAREFF Photo Engine 1.0 RC', 'HV One 1.2'), ('HAREFF 1.0 RC', 'HV One 1.2'), ('Установить HAREFF', 'Установить HV One'), ('Install HAREFF', 'Install HV One'), ('HAREFF / SIGNATURE COLLECTION 01', 'HV / SIGNATURE COLLECTION 01'), ('HAREFF DIGITAL STUDIO · COMMERCIAL BETA 0.9', 'HAREFF DIGITAL STUDIO · HV ONE 1.2'), ('HAREFF Batch Processing 1.0 RC', 'HV One Batch Processing 1.2'), ("'HAREFF Custom'", "'HV One Custom'"), ("'_HAREFF.'", "'_HV_One.'"), ('HAREFF_export_report.txt', 'HV_One_export_report.txt'), ('HAREFF_Batch_', 'HV_One_Batch_'), ('HAREFF_diagnostics.txt', 'HV_One_diagnostics.txt')]
              for old,new in replacements:
                  assert old in s, 'Missing expected text: '+old[:80]
                  s=s.replace(old,new)
              assert s.count('</style>')==1
              s=s.replace('</style>','\n/* HV One 1.2 branding */\n.brand strong{letter-spacing:.045em;text-transform:none;color:#f2f3f4}.brand small{letter-spacing:.10em}.brand svg{width:40px;height:40px}.brand{gap:8px}.brand svg g{fill:#d7dadf}@media(max-width:480px){.brand svg{width:32px;height:32px}.brand strong{font-size:19px}.brand small{font-size:8px}}\n'+'</style>')
              p.write_text(s,encoding='utf-8')
          p=Path('studio.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('HAREFF Digital Studio · Photo Engine','HV One · Professional Photo Editor').replace('<strong>HAREFF</strong>','<strong>HV One</strong>').replace('PREMIUM BLACK / RELEASE CANDIDATE 1.0','PREMIUM BLACK / ORIGINAL FIDELITY 1.2').replace('<h1>Photo Engine.</h1>','<h1>HV One.</h1>')
          assert '<h1>HV One.</h1>' in s
          p.write_text(s,encoding='utf-8')
          p=Path('manifest.webmanifest'); m=json.loads(p.read_text(encoding='utf-8')); m['name']='HV One — Professional Photo Editor'; m['short_name']='HV One'; p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('sw.js'); s=p.read_text(encoding='utf-8'); assert '1.1.1-fidelity-pages1' in s or 'hv-one-1.2-pages1' in s; s=s.replace('1.1.1-fidelity-pages1','hv-one-1.2-pages1'); p.write_text(s,encoding='utf-8')
          for name,data in {'icon-192.png': '', 'icon-512.png': ''}.items(): Path(name).write_bytes(base64.b64decode(data))
          PY_PATCH
          python3 <<'PY_CHECK'
          import re, pathlib, subprocess
          for f in ('index.html','studio.html'):
              for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',pathlib.Path(f).read_text(),re.S)):
                  p=pathlib.Path('/tmp') / ('hv-'+f+str(i)+'.js'); p.write_text(s); subprocess.run(['node','--check',str(p)],check=True)
          PY_CHECK
          node --check sw.js
          git config user.name 'HV One Update'
          git config user.email 'update@users.noreply.github.com'
          git add index.html studio.html manifest.webmanifest sw.js icon-192.png icon-512.png
          git diff --cached --quiet || git commit -m 'Rebrand HV One 1.2'
          git push
