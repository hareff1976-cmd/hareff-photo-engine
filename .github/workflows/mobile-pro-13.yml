name: HV One Mobile Pro 1.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-pro-13.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* HV One Mobile Pro 1.3 */'
          if marker not in s:
              assert '<aside class="side"><div class="group"><h2>01 / ПРОФИЛЬ ОБРАБОТКИ</h2>' in s, 'Install panel-order first'
              assert '<title>HV One 1.2 — Original Fidelity</title>' in s, 'Unexpected editor version'
              css='''
          /* HV One Mobile Pro 1.3 */
          .hv-mobile-nav,.hv-mobile-actions,.hv-mobile-extras{display:none}
          @media(max-width:850px) and (orientation:portrait) and (min-height:480px){
           .layout{grid-template-rows:minmax(0,60%) minmax(0,1fr) auto}
           .workspace{grid-template-rows:auto minmax(0,1fr) auto auto auto auto;gap:4px;padding:6px 9px}
           .stage{border-radius:13px;padding:4px}
           .hv-mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-width:0}
           .hv-mobile-nav button{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid #30343a;border-radius:10px;background:#1a1c20;padding:5px 1px;font-size:10px;line-height:1.2;min-height:47px;color:#d7dadf}
           .hv-mobile-nav button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
           .hv-mobile-nav button[aria-pressed=true]{border-color:#d7dadf;background:#30343a;color:#fff}
           .hv-mobile-actions{display:grid;grid-template-columns:36px 36px minmax(0,1fr) minmax(0,1fr);gap:5px;align-items:center;padding:5px 9px max(5px,env(safe-area-inset-bottom));border-top:1px solid #30343a;background:#101114;min-width:0}
           .hv-mobile-actions button{padding:6px 3px;min-height:38px;font-size:11px;white-space:nowrap}
           .hv-mobile-actions button:nth-child(-n+2){font-size:19px;line-height:1}
           .side{padding:8px 10px 14px;background:#141519;scrollbar-width:thin}
           .side>.group:first-child{margin:0 0 5px;padding:0 0 5px;border:0}
           .side>.group:first-child h2{font-size:10px;margin:0 0 5px;letter-spacing:1px}
           .side #presets{display:flex;overflow-x:auto;gap:4px;padding-bottom:3px;scrollbar-width:thin}
           .side #presets button{flex:0 0 auto;padding:7px 9px;font-size:11px;min-height:32px}
           #controls>.group{margin:0;padding:6px 0;border-top:1px solid #30343a}
           #controls>.group:not([data-hv-visible=true]),#controls .control:not([data-hv-visible=true]){display:none}
           #controls>.group h2{display:none}
           #controls .control{margin-bottom:7px}
           #controls .control label{font-size:12px}
           #controls .control input{margin:2px 0 0;height:26px}
           .workspace .info #fidelityCheck,.workspace .info #fidelityOriginal{display:none!important}
           .hv-mobile-extras{display:block}
           .hv-mobile-extras button{width:100%;margin-top:5px}
           .workspace .status:empty{display:none}
           .hv-mobile-nav [lang=en],.hv-mobile-actions [lang=en],.hv-mobile-extras [lang=en]{display:none}
           html[lang=en] .hv-mobile-nav [lang=ru],html[lang=en] .hv-mobile-actions [lang=ru],html[lang=en] .hv-mobile-extras [lang=ru]{display:none}
           html[lang=en] .hv-mobile-nav [lang=en],html[lang=en] .hv-mobile-actions [lang=en],html[lang=en] .hv-mobile-extras [lang=en]{display:inline}
          }
          @media(max-width:850px) and (orientation:portrait) and (min-height:480px) and (max-height:680px){.layout{grid-template-rows:minmax(0,57%) minmax(0,1fr) auto}.hv-mobile-nav button{min-height:40px;padding:3px 1px}.hv-mobile-nav button svg{width:16px;height:16px}}
          '''
              js='''
          /* HV One Mobile Pro 1.3 */
          (()=>{
           const workspace=document.querySelector('.workspace'),side=document.querySelector('.side'),layout=document.querySelector('.layout'),controls=$('controls');
           const media=matchMedia('(max-width:850px) and (orientation:portrait) and (min-height:480px)');
           const groups=[
           ['light','Свет','Light',['exposure','highlights','shadows'],'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>'],
           ['contrast','Контраст','Contrast',['contrast','dehaze'],'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>'],
           ['color','Цвет','Color',['temperature','tint','saturation','vibrance'],'<circle cx="9" cy="10" r="5"/><circle cx="15" cy="10" r="5"/><circle cx="12" cy="15" r="5"/>'],
           ['detail','Детали','Detail',['clarity','sharpness','edgeSharp','microContrast'],'<path d="M3 20 10 5l7 15ZM14 20l4-9 4 9"/>'],
           ['noise','Шум','Noise',['noiseLuma','noiseChroma','textureProtect'],'<path d="M5 5h.1M12 5h.1M19 5h.1M5 12h.1M12 12h.1M19 12h.1M5 19h.1M12 19h.1M19 19h.1" stroke-width="3"/>']
           ];
           const label=(ru,en)=>`<span lang="ru">${ru}</span><span lang="en">${en}</span>`;
           // Register exact labels with the existing language translator so text nodes
           // inside explicit language spans are not translated into the wrong language.
           const nav=document.createElement('nav');nav.className='hv-mobile-nav';nav.setAttribute('aria-label','Инструменты / Tools');
           let selected='light';
           function select(id,scroll){selected=id;const keys=groups.find(x=>x[0]===id)[3];
             for(const [k,f] of Object.entries(fields))f.inp.closest('.control').dataset.hvVisible=String(keys.includes(k));
             for(const g of controls.children)g.dataset.hvVisible=String(!!g.querySelector('.control[data-hv-visible="true"]'));
             for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.tool===id));
             if(scroll&&media.matches)side.scrollTop=0;
           }
           for(const [id,ru,en,keys,icon] of groups){const b=document.createElement('button');b.type='button';b.dataset.tool=id;b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label(ru,en)}`;b.setAttribute('aria-label',ru+' / '+en);b.onclick=()=>select(id,true);nav.append(b)}
           workspace.querySelector('.comparebar').after(nav);
           const actions=document.createElement('div');actions.className='hv-mobile-actions';
           const extras=document.createElement('details');extras.className='hv-mobile-extras';extras.innerHTML='<summary>'+label('Original Fidelity / Оригинал','Original Fidelity / Original')+'</summary>';
           function proxy(parent,id,content,aria,cls=''){const original=$(id),b=document.createElement('button');b.type='button';b.className=cls;b.innerHTML=content;b.setAttribute('aria-label',aria);b.onclick=()=>{if(!original.disabled)original.click()};const sync=()=>{b.disabled=original.disabled};new MutationObserver(sync).observe(original,{attributes:true,attributeFilter:['disabled']});sync();parent.append(b);return b;}
           proxy(actions,'undo','↶','Отмена / Undo');proxy(actions,'redo','↷','Повтор / Redo');proxy(actions,'presetExport',label('Экспорт JSON','Export JSON'),'Экспорт JSON / Export JSON');proxy(actions,'save',label('Сохранить','Save'),'Сохранить / Save','primary');layout.append(actions);
           proxy(extras,'fidelityCheck',label('Проверка пикселей','Pixel test'),'Проверка пикселей / Pixel test');proxy(extras,'fidelityOriginal',label('Скачать оригинал','Original file'),'Скачать оригинал / Original file');side.querySelector('.foot').before(extras);
           // Use CSS for mobile-only visibility; existing desktop and landscape DOM controls remain visible.
           select(selected,false);
          })();
          '''
              # Existing translation walker must not rewrite the bilingual spans.
              old="if(!el||el.closest('.batch-name,#rawInfo,#localList,#maskList')"
              assert s.count(old)==1
              s=s.replace(old,"if(!el||el.closest('.hv-mobile-nav [lang],.hv-mobile-actions [lang],.hv-mobile-extras [lang]')||el.closest('.batch-name,#rawInfo,#localList,#maskList')",1)
              assert s.count('</style>')==1 and s.count('</script></body></html>')==1
              s=s.replace('</style>',css+'\n</style>',1).replace('</script></body></html>',js+'\n</script></body></html>',1)
              s=s.replace('<title>HV One 1.2 — Original Fidelity</title>','<title>HV One 1.3 — Mobile Pro Interface</title>',1).replace('PHOTO EDITOR / 1.2','PHOTO EDITOR / 1.3',1).replace('HV ONE 1.2</div>','HV ONE 1.3</div>',1)
              assert 'hareff.signature01.token.v1' in s and 'function fidelityNeutral' in s
              p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          assert 'hv-one-1.2-pages2' in s or 'hv-one-1.3-mobile-pages1' in s, 'Unexpected service worker version'
          p.write_text(s.replace('hv-one-1.2-pages2','hv-one-1.3-mobile-pages1'),encoding='utf-8')
          # Verify inline JavaScript without external dependencies.
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          with tempfile.TemporaryDirectory() as td:
              scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)
              assert scripts
              for i,js in enumerate(scripts):
                  p=Path(td)/f'check{i}.js'
                  p.write_text(js,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
          node --check sw.js
          git config user.name "HV One Update"
          git config user.email "update@users.noreply.github.com"
          git add index.html sw.js
          git diff --cached --quiet || git commit -m "HV One 1.3 Mobile Pro Interface"
          git push
